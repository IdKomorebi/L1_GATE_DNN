dataset:
  name: data2025_Processed_V2
  processed_csv: data/processed/data2025_Processed_V2/pjm_rto_hourly_2025_aligned_processed_one_header.csv
  time_index_csv: data/processed/data2025_Processed_V2/pjm_rto_hourly_2025_aligned_processed_one_header.csv
  output_root: outputs/data2025_Processed_V2

preprocessing:
  drop_all_zero_columns: false
  exclude_columns: []

relations:
  metrics: [nmi, spearman, pearson, kendall, distance_corr, hsic]
  thresholds:
    nmi: 0.05
    spearman: 0.10
    pearson: 0.10
    kendall: 0.08
    distance_corr: 0.10
    hsic: 0.05
  sample_size: 3000
  expensive_sample_size: 1200

feature_selection:
  require_any_metric: true
  fallback_top_k: 15
  max_features:

experiment:
  centers:
    - total_gen
    - total_lmp_da
    - congestion_price_da
    - metered_load_mw
  models:
    - DNN
    - L1GateDNN
    - ImprovedL1GateDNN
    - ImprovedL2GateDNN

column_combinations:
  1:
    name: total_lmp_rt_no_formula
    center: total_lmp_rt
    exclude_columns:
      - system_energy_price_rt
      #- congestion_price_rt
      - marginal_loss_price_rt

  2:
    name: total_lmp_da_no_formula
    center: total_lmp_da
    exclude_columns:
      - system_energy_price_da
      - congestion_price_da
      - marginal_loss_price_da

  3:
    name: gross_actual_interchange_no_gross_related
    center: gross_actual_interchange_mw
    exclude_columns:
      - gross_sched_interchange_mw
      - gross_inadv_interchange_mw

  4:
    name: net_actual_interchange_no_net_sched
    center: net_actual_interchange_mw
    exclude_columns:
      - net_sched_interchange_mw

  5:
    name: net_actual_interchange_mw_no_net_sched_interchange_mw
    center: net_actual_interchange_mw
    exclude_columns:
      - net_sched_interchange_mw
      - total_gen
  6:
    name: metered_load_mw_no_total_gen
    center: metered_load_mw
    exclude_columns:
      - total_gen
      - prelim_load_avg_hourly
      - total_pjm_rt_load_mwh

  7:
    name: congestion_price_da_no_2features
    center: congestion_price_da
    exclude_columns:
      - total_lmp_da
      #- system_energy_price_da 
training:
  epochs: 200
  batch_size: 50
  lr: 0.001
  train_ratio: 0.8
  random_state: 42
  hidden_dims: [64, 32, 16]
  key_epochs: [10, 20, 50, 100, 200]

model_params:
  DNN: {}

  L1GateDNN:
    lambda_l1: 0.002
    active_threshold: 0.06

  ImprovedL1GateDNN:
    lambda_l1: 0.001
    warmup_epochs: 50
    active_threshold: 0.06

  ImprovedL2GateDNN:
    lambda_l2: 0.001
    warmup_epochs: 50
    risk_threshold: 0.50
    dropout: 0.05
    net_weight_decay: 0.0001
    meta_weight_decay: 0.00001
    early_stopping_patience: 25
    early_stopping_min_delta: 0.00001

validation:
  l1_redundancy:
    run_dir: outputs\data2025_Processed_V2\CenterOn_net_actual_interchange_mw\L1GateDNN\run_20260517_215336_combo5_L1GateDNN
    train_ratio: 0.8
    random_state: 42
    hidden_dims: [64, 32, 16]
    device: cpu
    include_drop_one: true
    include_unselected: true
    output_dir:

baseline_comparison:
  centers:
    - net_actual_interchange_mw
    - gross_actual_interchange_mw
    - net_sched_interchange_mw
    - total_gen
    - metered_load_mw
    - total_losses
    - congestion_price_da
    - congestion_price_rt
    - marginal_loss_price_da
    - total_lmp_da
    - da_as_total_mw_primary_reserve
    - da_as_total_mw_thirty_minutes_reserve

  baselines: all
  min_features: 2
  max_features: 10
  fixed_feature_count:
  main_method: L1GateDNN
  output_dir: BaselineComparison
  run_name: baseline_15y_all
  skip_existing: false
  reuse_l1_runs: false
  train_l1_if_missing: true
  force_l1_relations: false
  device: auto
  random_state: 42
  dnn_training_overrides:
    epochs: 150
    batch_size: 50
    lr: 0.001
    train_ratio: 0.8
    random_state: 42
    hidden_dims: [64, 32, 16]
  l1_training_overrides:
    epochs: 200
    batch_size: 50
    lr: 0.001
    train_ratio: 0.8
    random_state: 42
    hidden_dims: [64, 32, 16]
    key_epochs: [10, 20, 50, 100, 200]
    lambda_l1: 0.002
    active_threshold: 0.15
  lasso_alpha: 0.001
  elasticnet_alpha: 0.001
  elasticnet_l1_ratio: 0.5
  linear_max_iter: 20000
  rf_n_estimators: 300
  rf_max_depth:
  rf_min_samples_leaf: 1
  xgb_n_estimators: 300
  xgb_max_depth: 4
  xgb_learning_rate: 0.05
  xgb_subsample: 0.9
  xgb_colsample_bytree: 0.9
  xgb_importance_type: gain
  n_jobs: -1
