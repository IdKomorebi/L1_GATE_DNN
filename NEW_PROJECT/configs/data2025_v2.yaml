dataset:
  name: data2025_Processed_V2
  processed_csv: data/processed/data2025_Processed_V2/pjm_rto_hourly_2025_aligned_processed_one_header.csv
  time_index_csv: data/processed/data2025_Processed_V2/pjm_rto_hourly_2025_aligned_processed_one_header.csv
  output_root: outputs/data2025_Processed_V2

preprocessing:
  drop_all_zero_columns: false
  exclude_columns: []

relations:
  metrics: [nmi, spearman, pearson, kendall, distance_corr, hsic]
  thresholds:
    nmi: 0.06
    spearman: 0.15
    pearson: 0.15
    kendall: 0.12
    distance_corr: 0.20
    hsic: 0.25
  sample_size: 3000
  expensive_sample_size: 1200

feature_selection:
  require_any_metric: true
  fallback_top_k: 15
  max_features:

experiment:
  centers:
    - total_gen
    - total_lmp_da
    - congestion_price_da
    - metered_load_mw
  models:
    - DNN
    - L1GateDNN
    - ImprovedL1GateDNN
    - ImprovedL2GateDNN

column_combinations:
  1:
    name: total_lmp_rt_no_formula
    center: total_lmp_rt
    exclude_columns:
      - system_energy_price_rt
      #- congestion_price_rt
      - marginal_loss_price_rt

  2:
    name: total_lmp_da_no_formula
    center: total_lmp_da
    exclude_columns:
      - system_energy_price_da
      - congestion_price_da
      - marginal_loss_price_da

  3:
    name: gross_actual_interchange_no_gross_related
    center: gross_actual_interchange_mw
    exclude_columns:
      - gross_sched_interchange_mw
      - gross_inadv_interchange_mw

  4:
    name: net_actual_interchange_no_net_sched
    center: net_actual_interchange_mw
    exclude_columns:
      - net_sched_interchange_mw

  5:
    name: net_actual_interchange_mw_no_net_sched_interchange_mw
    center: net_actual_interchange_mw
    exclude_columns:
      - net_sched_interchange_mw
      - total_gen
  6:
    name: metered_load_mw_no_total_gen
    center: metered_load_mw
    exclude_columns:
      - total_gen
      - prelim_load_avg_hourly
      - total_pjm_rt_load_mwh

  7:
    name: congestion_price_da_no_2features
    center: congestion_price_da
    exclude_columns:
      - total_lmp_da
      #- system_energy_price_da 
training:
  epochs: 200
  batch_size: 50
  lr: 0.001
  train_ratio: 0.8
  random_state: 42
  hidden_dims: [64, 32, 16]
  key_epochs: [10, 20, 50, 100, 200]

model_params:
  DNN: {}

  L1GateDNN:
    lambda_l1: 0.002
    active_threshold: 0.06

  ImprovedL1GateDNN:
    lambda_l1: 0.0015
    warmup_epochs: 50
    active_threshold: 0.50

  ImprovedL2GateDNN:
    lambda_l2: 0.001
    warmup_epochs: 50
    risk_threshold: 0.50
    dropout: 0.05
    net_weight_decay: 0.0001
    meta_weight_decay: 0.00001
    early_stopping_patience: 25
    early_stopping_min_delta: 0.00001

validation:
  l1_redundancy:
    run_dir: outputs\data2025_Processed_V2\CenterOn_net_actual_interchange_mw\L1GateDNN\run_20260517_215336_combo5_L1GateDNN
    train_ratio: 0.8
    random_state: 42
    hidden_dims: [64, 32, 16]
    device: cpu
    include_drop_one: true
    include_unselected: true
    output_dir:

baseline_comparison:
  centers:
    - net_actual_interchange_mw
    - gross_actual_interchange_mw
    - net_sched_interchange_mw
    - total_gen
    - metered_load_mw
    - total_losses
    - congestion_price_da
    - congestion_price_rt
    - marginal_loss_price_da
    - total_lmp_da
    - da_as_total_mw_primary_reserve
    - da_as_total_mw_thirty_minutes_reserve

  target_overrides:
    net_actual_interchange_mw:
      exclude_columns:
        - net_sched_interchange_mw
        - total_gen
      n_features: 13
      note: manual_exclude_n_v2; full_r2=0.966883; topn_r2=0.959721; top13 is within 0.01 of full; old handoff used n=16

    gross_actual_interchange_mw:
      exclude_columns: []
      n_features: 12
      note: manual_exclude_n_v2; full_r2=0.864887; topn_r2=0.865801; top12 matches full; no over-accurate shortcut

    net_sched_interchange_mw:
      exclude_columns:
        - net_actual_interchange_mw
        - total_gen
      n_features: 12
      note: manual_exclude_n_v2; full_r2=0.964838; topn_r2=0.956095; excluding net_actual and total_gen breaks 0.999 shortcut; top12 within 0.01

    total_gen:
      exclude_columns:
        - prelim_load_avg_hourly
        - metered_load_mw
        - total_pjm_rt_load_mwh
        - forecast_load_mw_latest_available
        - forecast_load_mw_day_ahead
        - wind_generation_mw
        - solar_generation_mw
        - gen_fuel_coal_mw
        - gen_fuel_gas_mw
        - gen_fuel_hydro_mw
        - gen_fuel_multiple_fuels_mw
        - gen_fuel_nuclear_mw
        - gen_fuel_oil_mw
        - gen_fuel_other_renewables_mw
        - gen_fuel_solar_mw
        - gen_fuel_storage_mw
        - gen_fuel_wind_mw
        - gen_fuel_coal_pct
        - gen_fuel_gas_pct
        - gen_fuel_hydro_pct
        - gen_fuel_multiple_fuels_pct
        - gen_fuel_nuclear_pct
        - gen_fuel_oil_pct
        - gen_fuel_other_renewables_pct
        - gen_fuel_solar_pct
        - gen_fuel_storage_pct
        - gen_fuel_wind_pct
      n_features: 15
      note: manual_exclude_n_v2; full_r2=0.920681; topn_r2=0.914915; single load excludes stayed near 0.999; broad proxy/component exclude gives full near 0.921 and top15 within 0.01

    metered_load_mw:
      exclude_columns:
        - total_gen
        - prelim_load_avg_hourly
        - total_pjm_rt_load_mwh
        - forecast_load_mw_latest_available
        - forecast_load_mw_day_ahead
        - wind_generation_mw
        - solar_generation_mw
        - gen_fuel_coal_mw
        - gen_fuel_gas_mw
        - gen_fuel_hydro_mw
        - gen_fuel_multiple_fuels_mw
        - gen_fuel_nuclear_mw
        - gen_fuel_oil_mw
        - gen_fuel_other_renewables_mw
        - gen_fuel_solar_mw
        - gen_fuel_storage_mw
        - gen_fuel_wind_mw
        - gen_fuel_coal_pct
        - gen_fuel_gas_pct
        - gen_fuel_hydro_pct
        - gen_fuel_multiple_fuels_pct
        - gen_fuel_nuclear_pct
        - gen_fuel_oil_pct
        - gen_fuel_other_renewables_pct
        - gen_fuel_solar_pct
        - gen_fuel_storage_pct
        - gen_fuel_wind_pct
      n_features: 15
      note: manual_exclude_n_v2; full_r2=0.916783; topn_r2=0.910171; direct-only excludes still stayed near 0.999; broad exclude gives full near 0.917 and top15 within 0.01

    total_losses:
      exclude_columns: []
      n_features: 16
      note: manual_exclude_n_v2; full_r2=0.943239; topn_r2=0.936411; no shortcut; top14 was just below full-0.01, top16 passes

    congestion_price_da:
      exclude_columns: []
      n_features: 2
      note: manual_exclude_n_v2; full_r2=0.936812; topn_r2=0.995009; top2 captures formula pair; excluding one caused large drop in earlier test

    congestion_price_rt:
      exclude_columns: []
      n_features: 10
      note: manual_exclude_n_v2; full_r2=0.672150; topn_r2=0.676734; full itself is low/moderate; top10 first reaches full level

    marginal_loss_price_da:
      exclude_columns: []
      n_features: 12
      note: manual_exclude_n_v2; full_r2=0.897897; topn_r2=0.898318; top12 reaches full level

    total_lmp_da:
      exclude_columns:
        - system_energy_price_da
        - congestion_price_da
        - marginal_loss_price_da
      n_features: 12
      note: manual_exclude_n_v2; full_r2=0.957618; topn_r2=0.954802; formula components excluded; top12 within 0.01

    da_as_total_mw_primary_reserve:
      exclude_columns:
        - da_as_as_mw_primary_reserve
        - da_as_nsr_mw_primary_reserve
      n_features: 8
      note: manual_exclude_n_v2; full_r2=0.849734; topn_r2=0.876784; exclude exact as_mw and nsr proxy; top8 exceeds full

    da_as_total_mw_thirty_minutes_reserve:
      exclude_columns:
        - da_as_as_mw_thirty_minutes_reserve
      n_features: 18
      note: manual_exclude_n_v2; full_r2=0.903935; topn_r2=0.896541; exclude exact as_mw; top18 within 0.01

  baselines: all
  min_features: 2
  max_features: 10
  fixed_feature_count:
  main_method: L1GateDNN
  output_dir: BaselineComparison
  run_name: manual_exclude_n_v2_script6
  skip_existing: true
  remaining_validation:
    enabled: true
  resume_l1_sources: true
  reuse_l1_runs: false
  train_l1_if_missing: true
  force_l1_relations: false
  quiet_l1_training: true
  device: auto
  random_state: 42
  dnn_training_overrides:
    epochs: 150
    batch_size: 50
    lr: 0.001
    train_ratio: 0.8
    random_state: 42
    hidden_dims: [64, 32, 16]
  l1_training_overrides:
    epochs: 200
    batch_size: 50
    lr: 0.001
    train_ratio: 0.8
    random_state: 42
    hidden_dims: [64, 32, 16]
    key_epochs: [10, 20, 50, 100, 200]
    lambda_l1: 0.002
    active_threshold: 0.15
  lasso_alpha: 0.001
  elasticnet_alpha: 0.001
  elasticnet_l1_ratio: 0.5
  linear_max_iter: 20000
  rf_n_estimators: 300
  rf_max_depth:
  rf_min_samples_leaf: 1
  xgb_n_estimators: 300
  xgb_max_depth: 4
  xgb_learning_rate: 0.05
  xgb_subsample: 0.9
  xgb_colsample_bytree: 0.9
  xgb_importance_type: gain
  n_jobs: -1
