dataset:
  name: data2025_Processed_V1
  processed_csv: data/processed/data2025_Processed_V1/data2025_processed.csv
  time_index_csv: data/processed/data2025_Processed_V1/data2025_processed_with_time_index.csv
  output_root: outputs/data2025_Processed_V1

preprocessing:
  drop_all_zero_columns: false
  exclude_columns: []

relations:
  metrics: [nmi, spearman, pearson, kendall, distance_corr, hsic]
  thresholds:
    nmi: 0.05
    spearman: 0.10
    pearson: 0.10
    kendall: 0.08
    distance_corr: 0.10
    hsic: 0.05
  sample_size: 3000
  expensive_sample_size: 1200

feature_selection:
  require_any_metric: true
  fallback_top_k: 15
  max_features:

experiment:
  centers:
    - total_gen
    - total_lmp_da
    - congestion_price_da
    - metered_load_mw
  models:
    - DNN
    - L1GateDNN
    - ImprovedL1GateDNN
    - ImprovedL2GateDNN

column_combinations:
  1:
    name: total_lmp_rt_no_formula
    center: total_lmp_rt
    exclude_columns:
      - system_energy_price_rt
      - congestion_price_rt
      - marginal_loss_price_rt

  2:
    name: total_lmp_da_no_formula
    center: total_lmp_da
    exclude_columns:
      - system_energy_price_da
      - congestion_price_da
      - marginal_loss_price_da

  3:
    name: gross_actual_interchange_no_gross_related
    center: gross_actual_interchange_mw
    exclude_columns:
      - gross_sched_interchange_mw
      - gross_inadv_interchange_mw

training:
  epochs: 200
  batch_size: 50
  lr: 0.001
  train_ratio: 0.8
  random_state: 42
  hidden_dims: [64, 32, 16]
  key_epochs: [10, 20, 50, 100, 200]

model_params:
  DNN: {}

  L1GateDNN:
    lambda_l1: 0.0001
    active_threshold: 0.06

  ImprovedL1GateDNN:
    lambda_l1: 0.0002
    warmup_epochs: 50
    active_threshold: 0.06

  ImprovedL2GateDNN:
    lambda_l2: 0.0003
    warmup_epochs: 50
    risk_threshold: 0.50
    dropout: 0.05
    net_weight_decay: 0.0001
    meta_weight_decay: 0.00001
    early_stopping_patience: 25
    early_stopping_min_delta: 0.00001

validation:
  l1_redundancy:
    run_dir: outputs/data2025_Processed_V1/CenterOn_total_lmp_rt/L1GateDNN/run_20260515_160904
    train_ratio: 0.8
    random_state: 42
    hidden_dims: [64, 32, 16]
    device: cpu
    include_drop_one: true
    include_unselected: true
    output_dir:
